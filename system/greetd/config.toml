# /etc/greetd/config.toml — greeter de Limitless
#
# tuigreet corre sobre la consola virtual, así que NO puede pintar hex: su
# --theme solo acepta los 16 nombres ANSI. La fidelidad de color no sale de
# aquí, sale de remapear la paleta del VT (ver system/vconsole/README.md):
# cuando tuigreet pide "blue", la consola pinta #3b9eff.
#
# Mapeo resultante:
#   black    #0e1524   superficie      gray         #7e93b0   acciones
#   blue     #3b9eff   蒼 · botones    darkgray     #46587a   bordes
#   magenta  #a970ff   茈 · prompt     lightblue    #8fe3ff   hora
#   red      #ff4a2e   赫 · error      white        #eaf2ff   texto e input

[terminal]
vt = 1

[default_session]
user = "greeter"
command = """tuigreet \
  --remember \
  --remember-user-session \
  --asterisks \
  --asterisks-char '·' \
  --time \
  --time-format '%H:%M  ·  %A %d de %B' \
  --greeting '⬡  L I M I T L E S S      無下限' \
  --width 46 \
  --window-padding 2 \
  --container-padding 2 \
  --prompt-padding 1 \
  --user-menu \
  --power-shutdown 'systemctl poweroff' \
  --power-reboot 'systemctl reboot' \
  --theme 'container=black;border=darkgray;title=magenta;greet=blue;time=lightblue;prompt=magenta;input=white;text=white;action=gray;button=blue' \
  --cmd 'uwsm start hyprland-uwsm.desktop'"""

# Notas de operación:
#
# --cmd arranca Hyprland envuelto en uwsm, que es lo que hace que los
#   servicios de la sesión mueran limpios al cerrar (LIMITLESS-OS.md §3.1).
#
# --remember-user-session guarda la última sesión por usuario: en una máquina
#   de un solo usuario significa que nunca vuelves a elegir sesión.
#
# --asterisks-char '·' usa el punto medio en vez del asterisco, que es el
#   mismo glifo que los puntos de la contraseña en la pantalla de bloqueo.
#
# El usuario 'greeter' debe existir y pertenecer al grupo 'video':
#   sudo useradd -M -G video greeter
#   sudo chmod -R go+r /etc/greetd/
