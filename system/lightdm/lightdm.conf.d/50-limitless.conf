# system/lightdm/lightdm.conf.d/50-limitless.conf
#
# LightDM lee /etc/lightdm/lightdm.conf.d/*.conf en orden — no se toca el
# lightdm.conf principal (puede traer ajustes propios de la distro), solo
# se añade este fragmento. greeter-session apunta al paquete que instala
# el tema HTML/CSS/JS (packages/pacman.txt: lightdm-webkit2-greeter).

[Seat:*]
greeter-session=lightdm-webkit2-greeter
user-session=hyprland-limitless
