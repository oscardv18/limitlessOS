# system/lightdm/lightdm-webkit2-greeter.conf → se instala en
# /etc/lightdm/lightdm-webkit2-greeter.conf
#
# webkit_theme apunta al nombre de carpeta bajo
# /usr/share/lightdm-webkit/themes/ — el instalador copia
# system/lightdm/theme/ ahí con el nombre "limitless".

[greeter]
webkit_theme = limitless
debug_mode = false
