# dev/minimal.conf — configuración de rescate (LIMITLESS-OS.md §1, Capa 3).
#
# NOTA DE HONESTIDAD: el resto del proyecto se escribe en Lua (Hyprland
# 0.55+, ver spec-layouts.md §0). Este archivo es la única excepción
# deliberada: es hyprlang (.conf), no Lua.
#
# El motivo: no pude verificar con la confianza que exijo en este proyecto
# los nombres EXACTOS de campos de la nueva API Lua (el wiki no se dejó
# extraer limpio — spec-layouts.md lo dice explícitamente). hyprlang sigue
# soportado en 0.56 y su sintaxis está fuera de duda. El único trabajo de
# este archivo es arrancar SIEMPRE, así que aquí la fiabilidad gana sobre
# la coherencia estética con el resto del repo. Cuando la sintaxis Lua 0.56
# esté confirmada línea a línea (no source, la próxima vez que se toque
# esto), se porta minimal.conf → minimal.lua y este comentario se borra.
#
# Uso:  Hyprland -c ~/.limitless/dev/minimal.conf
# Si esto no arranca, el problema es del sistema, no de tu configuración
# — toca instantánea (grub-btrfs) o USB de rescate.

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(3b9eff)
    col.inactive_border = rgb(1c2a40)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false   # nada de cristal aquí: si el problema ES el
    }                     # blur, esta config no debe reproducirlo
    shadow {
        enabled = false
    }
}

animations {
    enabled = false   # cero animaciones: si algo falla, que falle rápido y visible
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# un solo terminal, arrancado al entrar — es lo único que hace falta
# para diagnosticar: ver logs, montar la red, o hacer `journalctl -xe`
exec-once = ghostty || kitty || foot || xterm

bind = SUPER, RETURN, exec, ghostty || kitty || foot || xterm
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
