# hyprlock.conf — Fase 3 (LIMITLESS-OS.md §6). Formato hyprlang (NO Lua:
# hyprlock es un binario aparte del compositor, con su propio parser de
# config — sigue el lenguaje viejo de Hyprland, no `hl.*`). Sintaxis
# verificada contra configs reales publicados (dracula/hyprland,
# JaKooLit/Hyprland-Dots) tras fallar wiki.hypr.land (Anubis, patrón ya
# documentado en CLAUDE.md) — nunca escrita de memoria.
#
# Geometría y jerarquía visual traducidas de docs/mockups/limitless-shell.html
# (#lock, líneas 457-536): kanji → reloj enorme fino → fecha → usuario →
# campo de contraseña en píldora. Lo que el mockup logra con SVG animado
# (los anillos orbitando) y JS (temblor al fallar, halo que sigue al
# cursor) no tiene equivalente declarativo en hyprlock — se omite a
# propósito, no es un olvido.
#
# Colores: NUNCA hex aquí (regla de CLAUDE.md, "ningún hex literal fuera
# de themes/"). Se leen de un archivo generado por la plantilla de matugen
# para hyprlock (Fase 2/enjambre, `.agents/agents/theme-templates.md`),
# que esta línea `source` espera encontrar en esa ruta exacta con estas
# variables exportadas — contrato para quien escriba esa plantilla:
#   $accent  $accent_core  $surface_hi  $line  $text  $text_dim  $reversal  $void
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

# fondo: blur nativo de hyprlock sobre una captura de la pantalla real —
# es el análogo más fiel al backdrop-filter:blur(30px) saturate(120%) del
# mockup que el binario permite sin depender de layer-rules del compositor.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

# ── 無下限 — el nombre de la técnica, sobre el reloj ─────────────────────
label {
    monitor =
    text = 無下限
    color = $accent
    font_family = Noto Serif JP
    font_size = 13
    position = 0, 200
    halign = center
    valign = center
}

# ── reloj: enorme, fino, sin adornos ─────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text
    font_family = JetBrains Mono
    font_size = 100
    position = 0, 130
    halign = center
    valign = center
}

# ── fecha ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$(date '+%A · %d %B' | tr '[:lower:]' '[:upper:]')"
    color = $text_dim
    font_family = JetBrains Mono
    font_size = 10
    position = 0, 55
    halign = center
    valign = center
}

# ── usuario ────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] echo "$USER@$(hostname)"
    color = $text_dim
    font_family = JetBrains Mono
    font_size = 10.5
    position = 0, -10
    halign = center
    valign = center
}

# ── campo de contraseña — píldora (rounding=-1), el mismo truco que usa
#    el mockup con border-radius:999px ────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    rounding = -1
    outline_thickness = 2
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = $accent
    inner_color = $surface_hi
    font_color = $text
    check_color = $accent_core
    fail_color = $reversal
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $accent_core
    placeholder_text = <span foreground="##7e93b0">contraseña</span>
    hide_input = false
    fade_on_empty = false
    position = 0, -70
    halign = center
    valign = center
}

# ── pie: recordatorio de desbloqueo, coherente con el hint del mockup
#    ("↵ desbloquear") ────────────────────────────────────────────────────
label {
    monitor =
    text = ↵ desbloquear
    color = $text_dim
    font_family = JetBrains Mono
    font_size = 9
    position = 0, 34
    halign = center
    valign = bottom
}
