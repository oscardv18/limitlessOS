# hypridle.conf — Fase 3 (LIMITLESS-OS.md §6). También hyprlang, igual
# que hyprlock.conf (ver cabecera de ese archivo) — hypridle es el tercer
# binario aparte, protocolo ext-idle-notify-v1, no Lua.
#
# Cadena de inactividad de tres escalones, patrón verificado contra
# configs reales (JaKooLit/Hyprland-Dots) tras el mismo fallo de
# wiki.hypr.land que hyprlock.conf ya documenta:
#   1. atenuar pantalla (reversible al volver)
#   2. bloquear sesión — vía loginctl, que dispara general.lock_cmd
#   3. apagar salida de vídeo (DPMS) — la sesión ya está bloqueada
#
# El bloqueo real lo dispara `loginctl lock-session`, no `hyprlock`
# directo: hypridle escucha la señal de logind y ejecuta `lock_cmd` —
# así SUPER+K (dotctl lock, spec-keybinds.md) y el propio hypridle usan
# el mismo camino en vez de dos formas distintas de bloquear.

general {
    # El fondo animado se SUSPENDE antes de bloquear y se reanuda al
    # desbloquear. hyprlock tapa la pantalla entera y dibuja su propio
    # campo (preset `lock`): dejar el del escritorio pintando debajo es
    # gastar GPU en algo que nadie ve — plan.md §3.5b lo llama "el error
    # clásico de los rices con fondo animado". `|| true` en cada IPC: que
    # el shell no responda nunca debe impedir que la sesión se bloquee.
    lock_cmd = qs -c limitless ipc call wallpaper suspend || true; pidof hyprlock || hyprlock
    unlock_cmd = qs -c limitless ipc call wallpaper resume || true
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1. salvapantallas — 90 s. La técnica a pleno (preset `saver` del campo,
#    modules/Screensaver.qml). Es el escalón MÁS BARATO de deshacer: basta
#    mover el ratón. Va antes que atenuar a propósito — atenuar primero
#    haría que el salvapantallas apareciera ya oscurecido.
listener {
    timeout = 90
    on-timeout = qs -c limitless ipc call saver show
    on-resume = qs -c limitless ipc call saver hide
}

# 2. atenuar — 3 min. brightnessctl guarda el valor real y lo restaura al
#    volver; en equipos sin backlight controlable el comando simplemente
#    no hace nada (no falla la cadena).
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 3. bloquear — 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 4. apagar salida — 6 min, ya bloqueada
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
